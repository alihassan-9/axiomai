name: financial-auditor

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: auditor
      POSTGRES_PASSWORD: auditor
      POSTGRES_DB: auditor
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: [ollamadata:/root/.ollama]
    # After first start: docker compose exec ollama ollama pull llama3.1
    #                    docker compose exec ollama ollama pull bge-m3

  api:
    build: ./backend
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://auditor:auditor@postgres:5432/auditor
      DATABASE_SYNC_URL: postgresql+psycopg2://auditor:auditor@postgres:5432/auditor
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      OLLAMA_BASE_URL: http://ollama:11434
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      CORS_ORIGINS: http://localhost:3000
      VECTOR_STORE_DIR: /srv/storage/vector_store
      ENVIRONMENT: development
    ports: ["8000:8000"]
    volumes: [vectorstore:/srv/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    environment: *backend_env
    volumes: [vectorstore:/srv/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
  ollamadata:
  vectorstore:
